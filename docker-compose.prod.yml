# The Docker target of the Studio unit: Caddy in front, studio, account and
# marketing as containers, one Postgres. Caddy sends `/account/*` of the Studio
# hostname to the account container and everything else to studio (Caddyfile).
# Images are `${IMAGE_REPO}-<app>:${IMAGE_TAG}`, GHCR's by default (deploy.yml
# pushes them and sets IMAGE_TAG to the commit); `--build` builds them here.
# Runtime configuration is read from env/<app>.env, written from sops;
# IMAGE_TAG, SITE_ADDRESS, MARKETING_ADDRESS and POSTGRES_PASSWORD come from the
# compose environment (`.env` next to this file on the machine).
#
# Locally: write env/<app>.env and export POSTGRES_PASSWORD and the VITE_* URLs
# the way validate-prs.yml's "Docker target" job does (vesact-secrets-and-local-env
# skill), then `docker compose -f docker-compose.prod.yml up --build -d --wait`.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  logging: *logging

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: vesact
    # Loopback only: migrations reach it through an SSH tunnel (deploy.yml).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  studio:
    <<: *app
    image: ${IMAGE_REPO:-ghcr.io/vesacthq/vesact}-studio:${IMAGE_TAG:-latest}
    build:
      context: .
      args: &build-args
        APP: studio
        VITE_STUDIO_URL: ${VITE_STUDIO_URL:-}
        VITE_ACCOUNT_URL: ${VITE_ACCOUNT_URL:-}
        VITE_MARKETING_URL: ${VITE_MARKETING_URL:-}
        VITE_DOCS_URL: ${VITE_DOCS_URL:-}
        VITE_POSTHOG_KEY: ${VITE_POSTHOG_KEY:-}
        VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-}
    env_file: env/studio.env
    healthcheck: &health
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  account:
    <<: *app
    image: ${IMAGE_REPO:-ghcr.io/vesacthq/vesact}-account:${IMAGE_TAG:-latest}
    build:
      context: .
      args:
        <<: *build-args
        APP: account
    env_file: env/account.env
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/account/api/health"]

  marketing:
    <<: *app
    image: ${IMAGE_REPO:-ghcr.io/vesacthq/vesact}-marketing:${IMAGE_TAG:-latest}
    build:
      context: .
      args:
        <<: *build-args
        APP: marketing
    env_file: env/marketing.env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - studio
      - account
      - marketing
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
      MARKETING_ADDRESS: ${MARKETING_ADDRESS:-http://localhost:3001}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      # The local marketing address; a public deployment gives it a hostname on 443.
      - "127.0.0.1:3001:3001"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

  # job: the background worker of docs/studio/architecture.md §5.4 starts here
  # with the studio image and a different command once the job table exists.

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
