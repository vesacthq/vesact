# The Docker target of the Studio unit: studio, account and marketing as
# containers, one Postgres. Images come from GHCR (deploy.yml) or `--build`.
# Runtime configuration is read from env/<app>.env, written from sops.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.local up --build

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  logging: *logging

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: vesact
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  studio:
    <<: *app
    image: ${STUDIO_IMAGE:-ghcr.io/vesacthq/vesact-studio:latest}
    build:
      context: .
      args: &build-args
        APP: studio
        VITE_STUDIO_URL: ${VITE_STUDIO_URL:-}
        VITE_ACCOUNT_URL: ${VITE_ACCOUNT_URL:-}
        VITE_MARKETING_URL: ${VITE_MARKETING_URL:-}
        VITE_RELAY_URL: ${VITE_RELAY_URL:-}
        VITE_RELAY_API_URL: ${VITE_RELAY_API_URL:-}
        VITE_DOCS_URL: ${VITE_DOCS_URL:-}
        VITE_POSTHOG_KEY: ${VITE_POSTHOG_KEY:-}
        VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-}
    env_file: env/studio.env
    ports:
      - "3000:3000"
    healthcheck: &health
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  account:
    <<: *app
    image: ${ACCOUNT_IMAGE:-ghcr.io/vesacthq/vesact-account:latest}
    build:
      context: .
      args:
        <<: *build-args
        APP: account
    env_file: env/account.env
    ports:
      - "3004:3000"
    healthcheck: *health

  marketing:
    <<: *app
    image: ${MARKETING_IMAGE:-ghcr.io/vesacthq/vesact-marketing:latest}
    build:
      context: .
      args:
        <<: *build-args
        APP: marketing
    env_file: env/marketing.env
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5

  # job: the background worker of docs/studio/architecture.md §5.4 starts here
  # with the studio image and a different command once the job table exists.

volumes:
  postgres_data:
