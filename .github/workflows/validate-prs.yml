name: Validate PRs

on:
  pull_request:
    branches: [main]

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: jinl0ngs-projects
  BETTER_AUTH_SECRET: "better-auth-e2e-secret-1234567890"
  RESEND_API_KEY: "resend-api-key-1234567890"
  VITE_STUDIO_URL: "http://localhost:3000"
  VITE_ACCOUNT_URL: "http://localhost:3004/account"
  VITE_MARKETING_URL: "http://localhost:3001"
  VITE_DOCS_URL: "http://localhost:3002"

jobs:
  lint:
    name: Lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Oxlint + Oxfmt
        run: pnpm verify

  type-check:
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tsc --noEmit across the workspace
        run: pnpm type-check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build every app
        run: pnpm build

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Vitest
        run: pnpm test

  docker:
    name: Docker target
    runs-on: ubuntu-latest
    env:
      VITE_STUDIO_URL: http://localhost
      VITE_ACCOUNT_URL: http://localhost/account
      VITE_MARKETING_URL: http://localhost:3001
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/vesact
      IMAGE_REPO: vesact
      IMAGE_TAG: ci
      POSTGRES_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the studio image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: vesact-studio:ci
          build-args: |
            APP=studio
            VITE_STUDIO_URL=${{ env.VITE_STUDIO_URL }}
            VITE_ACCOUNT_URL=${{ env.VITE_ACCOUNT_URL }}
            VITE_MARKETING_URL=${{ env.VITE_MARKETING_URL }}
      - name: Build the account image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: vesact-account:ci
          build-args: |
            APP=account
            VITE_STUDIO_URL=${{ env.VITE_STUDIO_URL }}
            VITE_ACCOUNT_URL=${{ env.VITE_ACCOUNT_URL }}
            VITE_MARKETING_URL=${{ env.VITE_MARKETING_URL }}
      - name: Build the marketing image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: vesact-marketing:ci
          build-args: |
            APP=marketing
            VITE_STUDIO_URL=${{ env.VITE_STUDIO_URL }}
            VITE_ACCOUNT_URL=${{ env.VITE_ACCOUNT_URL }}
            VITE_MARKETING_URL=${{ env.VITE_MARKETING_URL }}
      - name: Write the runtime env files
        run: |
          mkdir -p env
          for app in studio account marketing; do
            cat > "env/$app.env" <<VARS
          DATABASE_URL=postgresql://postgres:postgres@postgres:5432/vesact
          BETTER_AUTH_SECRET=better-auth-e2e-secret-1234567890
          GOOGLE_CLIENT_ID=google-client-id
          GOOGLE_CLIENT_SECRET=google-client-secret
          VITE_STUDIO_URL=$VITE_STUDIO_URL
          VITE_ACCOUNT_URL=$VITE_ACCOUNT_URL
          VITE_MARKETING_URL=$VITE_MARKETING_URL
          VARS
          done
          # The runner's own Postgres holds 5432; the schema push uses 5433.
          cat > ci.override.yml <<'YML'
          services:
            postgres:
              ports: !override
                - "127.0.0.1:5433:5432"
          YML
      - name: Start the stack
        run: docker compose -f docker-compose.prod.yml -f ci.override.yml up -d --wait --wait-timeout 180
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply the schema
        run: pnpm --filter @repo/database push
      - name: Smoke
        run: .github/scripts/smoke.sh http://localhost http://localhost:3001
      - name: Container logs
        if: failure()
        run: docker compose -f docker-compose.prod.yml -f ci.override.yml logs --no-color --tail 200

  e2e:
    name: Playwright e2e
    if: github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 60
    runs-on: ubuntu-latest
    needs: [lint, type-check, build, unit]
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/vesact
      # The client bundles read these; they must name the ports Playwright serves
      # the apps on, the same ones the .dev.vars below give the Workers.
      VITE_ACCOUNT_URL: http://localhost:3200/account
      VITE_STUDIO_URL: http://localhost:3100
      VITE_MARKETING_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start the database and object storage
        run: |
          docker compose up -d --wait postgres
          docker compose up -d minio minio-setup
      - name: Apply the schema
        run: pnpm --filter @repo/database push
      - name: Write the local Worker vars
        run: |
          cat > apps/account/.dev.vars <<'VARS'
          VITE_ACCOUNT_URL="http://localhost:3200/account"
          VITE_STUDIO_URL="http://localhost:3100"
          VITE_MARKETING_URL="http://localhost:3001"
          BETTER_AUTH_SECRET="better-auth-e2e-secret-1234567890"
          GOOGLE_CLIENT_ID="google-client-id"
          GOOGLE_CLIENT_SECRET="google-client-secret"
          S3_ENDPOINT="http://localhost:9000"
          S3_REGION="auto"
          S3_ACCESS_KEY_ID="minioadmin"
          S3_SECRET_ACCESS_KEY="minioadmin"
          VARS
          cat > apps/studio/.dev.vars <<'VARS'
          VITE_STUDIO_URL="http://localhost:3100"
          VITE_ACCOUNT_URL="http://localhost:3200/account"
          VITE_MARKETING_URL="http://localhost:3001"
          BETTER_AUTH_SECRET="better-auth-e2e-secret-1234567890"
          GOOGLE_CLIENT_ID="google-client-id"
          GOOGLE_CLIENT_SECRET="google-client-secret"
          S3_ENDPOINT="http://localhost:9000"
          S3_REGION="auto"
          S3_ACCESS_KEY_ID="minioadmin"
          S3_SECRET_ACCESS_KEY="minioadmin"
          VARS
      - name: Run Playwright tests for the marketing app
        run: pnpm --filter marketing e2e:ci
      - name: Run Playwright tests for the account app
        run: pnpm --filter account e2e:ci
      - name: Run Playwright tests for the Studio app
        run: pnpm --filter studio e2e:ci
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            apps/marketing/playwright-report/
            apps/account/playwright-report/
            apps/account/test-results/
            apps/studio/playwright-report/
            apps/studio/test-results/
          retention-days: 30
