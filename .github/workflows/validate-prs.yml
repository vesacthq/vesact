name: Validate PRs

on:
  pull_request:
    branches: [main]

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: jinl0ngs-projects
  BETTER_AUTH_SECRET: "better-auth-e2e-secret-1234567890"
  RESEND_API_KEY: "resend-api-key-1234567890"
  VITE_STUDIO_URL: "http://localhost:3000"
  VITE_AUTH_URL: "http://localhost:3004"
  VITE_MARKETING_URL: "http://localhost:3001"
  VITE_DOCS_URL: "http://localhost:3002"

jobs:
  lint:
    name: Lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Oxlint + Oxfmt
        run: pnpm verify

  type-check:
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tsc --noEmit across the workspace
        run: pnpm type-check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build every app
        run: pnpm build

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Vitest
        run: pnpm test

  e2e:
    name: Playwright e2e
    if: github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 60
    runs-on: ubuntu-latest
    needs: [lint, type-check, build, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start object storage
        run: docker compose up -d minio minio-setup
      - name: Write the local Worker vars
        run: |
          cat > apps/auth/.dev.vars <<'VARS'
          VITE_AUTH_URL="http://localhost:3200"
          VITE_STUDIO_URL="http://localhost:3100"
          VITE_MARKETING_URL="http://localhost:3001"
          BETTER_AUTH_SECRET="better-auth-e2e-secret-1234567890"
          GOOGLE_CLIENT_ID="google-client-id"
          GOOGLE_CLIENT_SECRET="google-client-secret"
          VARS
          cat > apps/studio/.dev.vars <<'VARS'
          VITE_STUDIO_URL="http://localhost:3100"
          VITE_AUTH_URL="http://localhost:3200"
          VITE_MARKETING_URL="http://localhost:3001"
          BETTER_AUTH_SECRET="better-auth-e2e-secret-1234567890"
          GOOGLE_CLIENT_ID="google-client-id"
          GOOGLE_CLIENT_SECRET="google-client-secret"
          S3_ENDPOINT="http://localhost:9000"
          S3_REGION="auto"
          S3_ACCESS_KEY_ID="minioadmin"
          S3_SECRET_ACCESS_KEY="minioadmin"
          VARS
      - name: Run Playwright tests for the marketing app
        run: pnpm --filter marketing e2e:ci
      - name: Run Playwright tests for the auth app
        run: pnpm --filter auth e2e:ci
      - name: Run Playwright tests for the Studio app
        run: pnpm --filter studio e2e:ci
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/studio/playwright-report/
          retention-days: 30
