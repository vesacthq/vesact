name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: jinl0ngs-projects
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  VITE_SAAS_URL: "https://vesact-saas.vesact.workers.dev"
  VITE_MARKETING_URL: "https://vesact-marketing.vesact.workers.dev"

jobs:
  marketing:
    name: Marketing
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter marketing build
      - name: Deploy
        if: github.event_name == 'push'
        run: pnpm exec wrangler deploy
        working-directory: apps/marketing
      - name: Upload a preview version
        if: github.event_name == 'pull_request'
        run: pnpm exec wrangler versions upload
        working-directory: apps/marketing

  saas:
    name: SaaS
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter saas build
      - name: Deploy
        run: pnpm exec wrangler deploy
        working-directory: apps/saas
