name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  TURBO_TEAM: jinl0ngs-projects
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

jobs:
  marketing:
    name: Marketing
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Select target
        run: .github/scripts/select-target.sh
      - name: Install sops
        run: .github/scripts/install-sops.sh
      - name: Load CI secrets
        run: .github/scripts/load-env.sh secrets/ci.env
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter marketing build
      - name: Deploy
        run: pnpm exec wrangler deploy
        working-directory: apps/marketing

  account:
    name: Account
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Select target
        run: .github/scripts/select-target.sh
      - name: Install sops
        run: .github/scripts/install-sops.sh
      - name: Load CI secrets
        run: .github/scripts/load-env.sh secrets/ci.env
      - name: Load database URL
        run: .github/scripts/load-env.sh "secrets/database.$TARGET.env"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Migrate
        run: pnpm --filter @repo/database migrate
      - name: Build
        run: pnpm --filter account build
      - name: Deploy
        run: pnpm exec wrangler deploy
        working-directory: apps/account
      - name: Sync secrets
        run: |
          sops -d "../../secrets/account.$TARGET.env" > "$RUNNER_TEMP/account.env"
          pnpm exec wrangler secret bulk "$RUNNER_TEMP/account.env" --name "$ACCOUNT_WORKER"
          rm "$RUNNER_TEMP/account.env"
        working-directory: apps/account

  studio:
    name: Studio
    needs: account
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Select target
        run: .github/scripts/select-target.sh
      - name: Install sops
        run: .github/scripts/install-sops.sh
      - name: Load CI secrets
        run: .github/scripts/load-env.sh secrets/ci.env
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter studio build
      - name: Deploy
        run: pnpm exec wrangler deploy
        working-directory: apps/studio
      - name: Sync secrets
        run: |
          sops -d "../../secrets/studio.$TARGET.env" > "$RUNNER_TEMP/studio.env"
          pnpm exec wrangler secret bulk "$RUNNER_TEMP/studio.env" --name "$STUDIO_WORKER"
          rm "$RUNNER_TEMP/studio.env"
        working-directory: apps/studio

  relay:
    name: Relay
    needs: account
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Select target
        run: .github/scripts/select-target.sh
      - name: Install sops
        run: .github/scripts/install-sops.sh
      - name: Load CI secrets
        run: .github/scripts/load-env.sh secrets/ci.env
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter relay build
      - name: Deploy
        run: pnpm exec wrangler deploy
        working-directory: apps/relay
      - name: Sync secrets
        run: |
          sops -d "../../secrets/relay.$TARGET.env" > "$RUNNER_TEMP/relay.env"
          pnpm exec wrangler secret bulk "$RUNNER_TEMP/relay.env" --name "$RELAY_WORKER"
          rm "$RUNNER_TEMP/relay.env"
        working-directory: apps/relay
