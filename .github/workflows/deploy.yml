name: Deploy

on:
  push:
    branches: [main]
  # Every pull request deploys preview, stacked ones included; production is push to main.
  pull_request:

# Every pull request deploys the same preview Workers and migrates the same preview
# database, so preview runs queue behind each other instead of racing: what preview
# shows is the last pull request pushed, and two migrations never overlap. GitHub
# keeps one pending run per group; an older pending one is cancelled (re-run it to
# put that pull request back on preview). Production has its own queue.
concurrency:
  group: deploy-${{ github.event_name == 'push' && github.ref || 'preview' }}
  cancel-in-progress: false

env:
  TURBO_TEAM: jinl0ngs-projects
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
  GH_TOKEN: ${{ github.token }}

jobs:
  images:
    name: Image ${{ matrix.app }}
    # The Docker target of the Studio unit, built here and handed to the
    # production machine through the R2 bucket vesact-images: the machine reaches
    # no registry. Runner -> R2 stays in the US; the machine pulls from
    # Cloudflare's edge at ~10 MB/s on nights when runner -> Shanghai does
    # 35 KB/s and COS drops the upload (#166, docs/decisions.md 2026-09-22).
    # Objects expire after 7 days; egress is free. If the machine cannot reach
    # R2, the image goes down the SSH session instead: slow, but it arrives.
    # The public URLs are the machine's (docs/studio/architecture.md §6).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MACHINE_HOST: 118.89.171.81
      MACHINE_USER: ubuntu
    strategy:
      matrix:
        app: [studio, account, marketing]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: vesact-${{ matrix.app }}:${{ github.sha }}
          build-args: |
            APP=${{ matrix.app }}
            VITE_STUDIO_URL=https://app.allcast.cc
            VITE_ACCOUNT_URL=https://app.allcast.cc/account
            VITE_MARKETING_URL=https://www.allcast.cc
            VITE_POSTHOG_HOST=https://e.vesact.com
            VITE_POSTHOG_KEY=phc_uLUk93bEHjHERp7hMxbDRiRPG4PefxhnzTkSGWYscgjR
            VITE_ICP_FILING_NUMBER=陕ICP备2026025839号-1
            VITE_PLACEHOLDER_SITE_NAME=西安速准科技有限公司
      - name: Install sops
        run: .github/scripts/install-sops.sh
      - name: Load CI secrets
        run: .github/scripts/load-env.sh secrets/ci.env
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          sops -d --input-type json --output-type binary secrets/files/machine-deploy-ssh-key.json > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cp .github/machine_known_hosts ~/.ssh/known_hosts
      - name: Load on the machine
        env:
          AWS_ACCESS_KEY_ID: ${{ env.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          OBJECT: s3://vesact-images/${{ github.sha }}/${{ matrix.app }}.tar.zst
        run: |
          docker save "vesact-${{ matrix.app }}:${{ github.sha }}" | zstd -T0 -3 > image.tar.zst
          # The bytes that cross the border, and how fast: #166 wants both in the log.
          bytes=$(stat -c %s image.tar.zst)
          started=$SECONDS
          aws s3 cp image.tar.zst "$OBJECT" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          # The presigned URL travels on stdin, not in the remote command line.
          if ! aws s3 presign "$OBJECT" --endpoint-url "$R2_ENDPOINT" --expires-in 3600 |
            ssh "$MACHINE_USER@$MACHINE_HOST" 'read -r url && curl -fsS --retry 3 "$url" | zstd -d | docker load'; then
            echo "the machine could not fetch from R2, piping over SSH"
            ssh -o ServerAliveInterval=30 "$MACHINE_USER@$MACHINE_HOST" 'zstd -d | docker load' < image.tar.zst
          fi
          echo "sent $((bytes / 1024 / 1024)) MiB in $((SECONDS - started))s"

  machine:
    name: Machine
    # The Docker target on the machine (docs/studio/architecture.md §6): migrate
    # through an SSH tunnel, refresh the compose files and env, then bring the
    # stack up on the images just loaded and smoke; machine-deploy.sh rolls back on
    # a failed smoke.
    needs: images
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MACHINE_HOST: 118.89.171.81
      MACHINE_USER: ubuntu
      SITE_URL: https://app.allcast.cc
      MARKETING_URL: https://www.allcast.cc
      APEX_URL: https://allcast.cc
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install sops
        run: .github/scripts/install-sops.sh
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          sops -d --input-type json --output-type binary secrets/files/machine-deploy-ssh-key.json > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cp .github/machine_known_hosts ~/.ssh/known_hosts
      - name: Load database URL
        run: .github/scripts/load-env.sh secrets/database.prod.env
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Write the machine's files
        # Decrypt first so a sops failure stops here instead of leaving an empty file on the machine.
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/env"
          for app in studio account marketing; do
            sops -d "secrets/$app.prod.env" > "$RUNNER_TEMP/env/$app.env"
          done
          sops -d secrets/prod.env > "$RUNNER_TEMP/dotenv"
          ssh "$MACHINE_USER@$MACHINE_HOST" 'mkdir -p /srv/vesact/env && chmod 700 /srv/vesact /srv/vesact/env'
          scp -q docker-compose.prod.yml Caddyfile .github/scripts/machine-deploy.sh .github/scripts/smoke.sh .github/scripts/machine-prune.sh "$MACHINE_USER@$MACHINE_HOST:/srv/vesact/"
          scp -q "$RUNNER_TEMP"/env/*.env "$MACHINE_USER@$MACHINE_HOST:/srv/vesact/env/"
          scp -q "$RUNNER_TEMP/dotenv" "$MACHINE_USER@$MACHINE_HOST:/srv/vesact/.env"
          rm -rf "$RUNNER_TEMP/env" "$RUNNER_TEMP/dotenv"
          ssh "$MACHINE_USER@$MACHINE_HOST" 'sudo install -m 755 /srv/vesact/machine-prune.sh /etc/cron.weekly/vesact-prune'
      - name: Migrate
        # The stack's Postgres is on the machine's loopback; the first deploy starts it before migrating.
        run: |
          ssh "$MACHINE_USER@$MACHINE_HOST" 'cd /srv/vesact && docker compose -f docker-compose.prod.yml up -d --wait postgres'
          ssh -f -N -o ExitOnForwardFailure=yes -L 55432:127.0.0.1:5432 "$MACHINE_USER@$MACHINE_HOST"
          pnpm --filter @repo/database migrate
      - name: Deploy
        run: ssh "$MACHINE_USER@$MACHINE_HOST" "cd /srv/vesact && ./machine-deploy.sh '${{ github.sha }}' '$SITE_URL' '$MARKETING_URL' '$APEX_URL'"

  marketing:
    name: Marketing
    # Preview on a pull request; on main the same Worker is Allcast's overseas
    # website, www.allcast.ai. The domestic www.allcast.cc is the Docker target.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Select target
        run: .github/scripts/select-target.sh
      - name: Install sops
        run: .github/scripts/install-sops.sh
      - name: Load CI secrets
        run: .github/scripts/load-env.sh secrets/ci.env
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        # The Worker's own address; select-target.sh's VITE_MARKETING_URL is the machine's.
        # The placeholder keeps the template landing page off a production hostname until
        # the Allcast site exists (#80), as on www.allcast.cc; unset it in both places then.
        run: |
          if [ "$TARGET" = prod ]; then
            export VITE_MARKETING_URL=https://www.allcast.ai
            export VITE_PLACEHOLDER_SITE_NAME=Allcast
          fi
          pnpm --filter marketing build
      - name: Deploy
        run: pnpm exec wrangler deploy
        working-directory: apps/marketing

  account:
    name: Account
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Select target
        run: .github/scripts/select-target.sh
      - name: Install sops
        run: .github/scripts/install-sops.sh
      - name: Load CI secrets
        run: .github/scripts/load-env.sh secrets/ci.env
      - name: Load database URL
        run: .github/scripts/load-env.sh "secrets/database.$TARGET.env"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Migrate
        run: pnpm --filter @repo/database migrate
      - name: Build
        run: pnpm --filter account build
      - name: Deploy
        # The secrets ride on the version being deployed. A separate `wrangler secret bulk`
        # after the deploy fails whenever another pull request deploys the same preview
        # Worker in between ("the latest version of your Worker isn't currently deployed").
        run: |
          sops -d "../../secrets/account.$TARGET.env" > "$RUNNER_TEMP/account.env"
          pnpm exec wrangler deploy --secrets-file "$RUNNER_TEMP/account.env"
          rm "$RUNNER_TEMP/account.env"
        working-directory: apps/account

  studio:
    name: Studio
    needs: account
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Select target
        run: .github/scripts/select-target.sh
      - name: Install sops
        run: .github/scripts/install-sops.sh
      - name: Load CI secrets
        run: .github/scripts/load-env.sh secrets/ci.env
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter studio build
      - name: Deploy
        # The secrets ride on the version being deployed. A separate `wrangler secret bulk`
        # after the deploy fails whenever another pull request deploys the same preview
        # Worker in between ("the latest version of your Worker isn't currently deployed").
        run: |
          sops -d "../../secrets/studio.$TARGET.env" > "$RUNNER_TEMP/studio.env"
          pnpm exec wrangler deploy --secrets-file "$RUNNER_TEMP/studio.env"
          rm "$RUNNER_TEMP/studio.env"
        working-directory: apps/studio

  relay:
    name: Relay
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Select target
        run: .github/scripts/select-target.sh
      - name: Install sops
        run: .github/scripts/install-sops.sh
      - name: Load CI secrets
        run: .github/scripts/load-env.sh secrets/ci.env
      - name: Load database URL
        run: .github/scripts/load-env.sh "secrets/relay-database.$TARGET.env"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Migrate
        run: pnpm --filter @repo/relay db:migrate
      - name: Build
        run: pnpm --filter relay build
      - name: Deploy
        # The secrets ride on the version being deployed. A separate `wrangler secret bulk`
        # after the deploy fails whenever another pull request deploys the same preview
        # Worker in between ("the latest version of your Worker isn't currently deployed").
        run: |
          sops -d "../../secrets/relay.$TARGET.env" > "$RUNNER_TEMP/relay.env"
          pnpm exec wrangler deploy --secrets-file "$RUNNER_TEMP/relay.env"
          rm "$RUNNER_TEMP/relay.env"
        working-directory: apps/relay

  www:
    name: Vesact website
    # Vesact's website is a Worker in every environment, like relay; it has no
    # database and no secrets, so the job is build and deploy.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Select target
        run: .github/scripts/select-target.sh
      - name: Install sops
        run: .github/scripts/install-sops.sh
      - name: Load CI secrets
        run: .github/scripts/load-env.sh secrets/ci.env
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter vesact-www build
      - name: Deploy
        run: pnpm exec wrangler deploy
        working-directory: apps/vesact-www
